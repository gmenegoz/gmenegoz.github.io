<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viaggio nel Sistema Solare</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:      #04060f;
    --bg-mid:       #0a1228;
    --bg-soft:      #131e3d;
    --blue-glow:    #4a8cff;
    --blue-bright:  #7cb0ff;
    --blue-pale:    #c8d8ff;
    --accent:       #ffd27a;
    --text:         #e8eeff;
    --text-dim:     #8aa0c8;
    --border:       rgba(124, 176, 255, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(74, 140, 255, 0.12), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(124, 176, 255, 0.08), transparent 50%),
      var(--bg-deep);
    min-height: 100vh;
  }

  /* Stelline di sfondo */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 60px 80px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 130px 50px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 200px 120px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 280px 30px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 350px 90px, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 100px 200px, rgba(200,216,255,0.6), transparent),
      radial-gradient(1px 1px at 250px 250px, rgba(255,255,255,0.4), transparent);
    background-repeat: repeat;
    background-size: 400px 300px;
    opacity: 0.6;
  }

  .app {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.2rem 2rem 0.6rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.6rem;
    letter-spacing: 0.04em;
    color: var(--blue-pale);
  }

  header h1 span {
    color: var(--accent);
    font-style: italic;
  }

  .slide-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 2rem;
    overflow-y: auto;
  }

  .slide {
    width: 100%;
    max-width: 1150px;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 2.2rem;
    align-items: center;
  }

  .image-column {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    align-items: center;
  }

  .image-box {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg-mid);
    border: 2px solid var(--border);
    box-shadow:
      0 0 60px rgba(74, 140, 255, 0.25),
      inset 0 0 30px rgba(0, 0, 0, 0.5);
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .image-box::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, transparent 50%, rgba(0,0,0,0.4));
    pointer-events: none;
  }

  .image-caption {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: -0.3rem;
  }

  /* Box "vista a occhio nudo" */
  .naked-eye-box {
    width: 100%;
    aspect-ratio: 16 / 7;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .naked-eye-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .naked-eye-box.unavailable {
    background: rgba(10, 18, 40, 0.6);
    color: var(--text-dim);
    font-size: 0.78rem;
    text-align: center;
    padding: 0.6rem 0.8rem;
    line-height: 1.4;
    font-style: italic;
  }

  .naked-eye-label {
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: -0.4rem;
  }

  .naked-eye-label strong {
    color: var(--blue-pale);
    font-weight: 600;
  }

  .info-box h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--blue-bright);
    line-height: 1;
    margin-bottom: 0.3rem;
    text-shadow: 0 0 30px rgba(124, 176, 255, 0.4);
  }

  .info-box .subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    font-style: italic;
    margin-bottom: 1.2rem;
    letter-spacing: 0.02em;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem 1.5rem;
    margin-bottom: 1.2rem;
    padding: 1rem 1.2rem;
    background: rgba(19, 30, 61, 0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    font-size: 0.85rem;
  }

  .stat .label {
    color: var(--text-dim);
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    margin-bottom: 0.15rem;
  }

  .stat .value {
    color: var(--blue-pale);
    font-weight: 500;
  }

  .curiosities {
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
    margin-bottom: 1rem;
  }

  .curiosities h3 {
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .curiosities ul {
    list-style: none;
  }

  .curiosities li {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 0.4rem;
    padding-left: 0.8rem;
    position: relative;
  }

  .curiosities li::before {
    content: '◆';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 0.6rem;
    top: 0.3rem;
  }

  /* Sezione esplorazione */
  .exploration {
    border-left: 2px solid var(--blue-glow);
    padding-left: 1rem;
  }

  .exploration h3 {
    color: var(--blue-bright);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .exploration p {
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--text);
  }

  .exploration p + p {
    margin-top: 0.4rem;
  }

  .exploration .mission-name {
    color: var(--blue-bright);
    font-weight: 600;
  }

  /* Navigazione */
  .nav {
    padding: 1rem 2rem 1.2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    background: rgba(4, 6, 15, 0.6);
    backdrop-filter: blur(8px);
  }

  .nav button {
    background: rgba(74, 140, 255, 0.12);
    border: 1px solid var(--blue-glow);
    color: var(--blue-pale);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.7rem 1.6rem;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.03em;
  }

  .nav button:hover:not(:disabled) {
    background: rgba(74, 140, 255, 0.25);
    box-shadow: 0 0 20px rgba(74, 140, 255, 0.4);
    transform: translateY(-1px);
  }

  .nav button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .counter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .counter .current {
    color: var(--accent);
    font-weight: 600;
    font-size: 1.5rem;
  }

  /* Responsive */
  @media (max-width: 850px) {
    .slide {
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }
    .image-column {
      max-width: 280px;
      margin: 0 auto;
    }
    .info-box h2 { font-size: 2.5rem; }
    .stats { grid-template-columns: 1fr; }
    header h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="app">
  <header>
    <h1>Viaggio nel <span>Sistema Solare</span></h1>
  </header>

  <div class="slide-container">
    <div class="slide" id="slide">
      <!-- contenuto dinamico -->
    </div>
  </div>

  <div class="nav">
    <button id="prev">◂ Indietro</button>
    <div class="counter"><span class="current" id="current">1</span> / <span id="total">15</span></div>
    <button id="next">Avanti ▸</button>
  </div>
</div>

totalEl.textContent = objects.length;

        <div class="stat"><span class="label">Temperatura</span><span class="value">${o.temperature}</span></div>
        <div class="stat"><span class="label">Densità</span><span class="value">${o.density}</span></div>
        <div class="stat"><span class="label">Atmosfera</span><span class="value">${o.atmosphere}</span></div>
      </div>
      <div class="curiosities">
        <h3>Lo sapevi che...</h3>
        <ul>
          ${o.facts.map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>
      <div class="exploration">
        <h3>${o.explorationTitle || 'Esplorazione'}</h3>
        ${o.exploration}
      </div>
    </div>
  `;
  currentEl.textContent = current + 1;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === objects.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (current < objects.length - 1) { current++; render(); }
});

// Navigazione con tastiera
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && current > 0) { current--; render(); }
  if (e.key === 'ArrowRight' && current < objects.length - 1) { current++; render(); }
});

render();
</script>
</body>
</html>
